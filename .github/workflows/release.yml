name: Publish Plugin Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^Version:[[:space:]]*//p' clickcosmo-spinning-wheel.php | head -n 1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "Could not read plugin version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin ZIP
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          rm -rf package clickcosmo-spinning-wheel.zip
          mkdir -p package/clickcosmo-spinning-wheel
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='package' \
            --exclude='*.zip' \
            ./ package/clickcosmo-spinning-wheel/
          cd package
          zip -r ../clickcosmo-spinning-wheel.zip clickcosmo-spinning-wheel

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$VERSION" \
            clickcosmo-spinning-wheel.zip \
            --target "$GITHUB_SHA" \
            --title "clickcosmo-spinning-wheel v$VERSION" \
            --generate-notes
