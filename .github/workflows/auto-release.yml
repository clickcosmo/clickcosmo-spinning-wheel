name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - "cc-spinning-wheel.php"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: none

      - name: Validate PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Read and validate plugin version
        id: version
        shell: bash
        run: |
          version="$(awk -F': ' '/^[[:space:]]*Version:/{print $2; exit}' cc-spinning-wheel.php | tr -d '\r')"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable ZIP
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p build/cc-spinning-wheel

          cp -R assets build/cc-spinning-wheel/
          cp -R includes build/cc-spinning-wheel/
          cp cc-spinning-wheel.php build/cc-spinning-wheel/
          cp wheel-logo.png build/cc-spinning-wheel/

          (
            cd build
            zip -rq "../cc-spinning-wheel-$VERSION.zip" cc-spinning-wheel
          )

          sha256sum "cc-spinning-wheel-$VERSION.zip"

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" "cc-spinning-wheel-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "ClickCOSMO Spinning Wheel $VERSION" \
            --generate-notes
